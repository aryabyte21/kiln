[project]
name = "kiln"
version = "1.0.0"
description = "A self-evolving tool registry for autonomous AI agents"
requires-python = ">=3.12"
dependencies = [
    "kiln-shared",
    "kiln-registry-api",
    "kiln-chat-backend",
    "kiln-synthesis-service",
    "kiln-tool-executor",
    "kiln-mcp-server",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.5.0",
    "pytest>=8.0",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["kiln_shared", "kiln_registry", "kiln_chat_backend", "kiln_synthesis", "kiln_executor", "kiln_mcp"]

[tool.uv.workspace]
members = [
    "packages/shared",
    "packages/chat_backend",
    "packages/registry_api",
    "packages/tool_executor",
    "packages/synthesis_service",
    "packages/mcp_server",
]

[tool.uv.sources]
kiln-shared = { workspace = true }
kiln-registry-api = { workspace = true }
kiln-chat-backend = { workspace = true }
kiln-synthesis-service = { workspace = true }
kiln-tool-executor = { workspace = true }
kiln-mcp-server = { workspace = true }
