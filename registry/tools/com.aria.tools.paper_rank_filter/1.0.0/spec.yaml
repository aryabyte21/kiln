babel_version: "1.0"

tool:
  id: com.aria.tools.paper_rank_filter
  name: paper_rank_filter
  version: 1.0.0
  description: Filter and rank a list of research papers based on recency, citation count, relevance to a specific topic, and other quality metrics.
  author: vibe_tool

interface:
  inputs:
    - name: papers
      type: array
      description: List of research papers with metadata (title, authors, abstract, publication date, citation count)
      required: true
    - name: query
      type: string
      description: The topic or keyword to filter papers by (e.g., 'transformer attention')
      required: true
    - name: top_n
      type: integer
      description: Number of top papers to return (e.g., 3)
      required: true
  outputs:
    - name: top_papers
      type: array
      description: List of the top N filtered papers with metadata

implementation:
  runtime: python3.10
  entrypoint: impl.py
  dependencies: []

testing:
  fixtures:
    - input:
        papers: []
        query: "test"
        top_n: 1
      expected_output_contains:
        - top_papers

metadata:
  tags: [synthesized]
  category: general
  generated_by: vibe_tool
