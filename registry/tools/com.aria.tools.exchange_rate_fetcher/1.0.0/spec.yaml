babel_version: "1.0"

tool:
  id: com.aria.tools.exchange_rate_fetcher
  name: exchange_rate_fetcher
  version: 1.0.0
  description: Fetch the current exchange rate between two specified currencies.
  author: vibe_tool

interface:
  inputs:
    - name: from_currency
      type: string
      description: The source currency code (e.g., SGD).
      required: true
    - name: to_currency
      type: string
      description: The target currency code (e.g., USD).
      required: true
  outputs:
    - name: exchange_rate
      type: float
      description: The current exchange rate from the source to the target currency.
    - name: timestamp
      type: string
      description: The timestamp of when the exchange rate was fetched.

implementation:
  runtime: python3.10
  entrypoint: impl.py
  dependencies: []

