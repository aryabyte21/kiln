babel_version: "1.0"
tool:
  id: com.aria.tools.wikipedia
  name: wikipedia_search
  version: "1.0.0"
  description: "Fetch a Wikipedia summary for any topic, person, place, or concept. Returns the title, plain-text extract, and page URL."
  author: aria
interface:
  inputs:
    - name: query
      type: string
      description: "Topic to search, e.g. 'Elon Musk', 'Singapore', 'quantum computing'"
      required: true
    - name: sentences
      type: integer
      description: "Max number of sentences to return (default 5)"
      required: false
      default: 5
  outputs:
    - name: title
      type: string
      description: Exact Wikipedia page title
    - name: summary
      type: string
      description: Plain-text extract from the article
    - name: url
      type: string
      description: Full URL to the Wikipedia page
    - name: success
      type: boolean
implementation:
  runtime: python3.10
  entrypoint: wikipedia.py
  dependencies:
    - requests>=2.28.0
testing:
  fixtures:
    - input:
        query: Singapore
      expected_output_contains: [title, summary, url, success]
    - input:
        query: Python programming language
        sentences: 3
      expected_output_contains: [title, success]
metadata:
  tags: [research, knowledge, wikipedia]
  category: research
