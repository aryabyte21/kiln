babel_version: "1.0"

tool:
  id: com.aria.tools.sec_filings_fetcher
  name: sec_filings_fetcher
  version: 1.0.0
  description: Fetch the latest SEC filings (e.g., 10-K, 10-Q) for a given company ticker symbol.
  author: vibe_tool

interface:
  inputs:
    - name: ticker
      type: string
      description: The stock ticker symbol of the company (e.g., NVDA for Nvidia)
      required: true
    - name: filing_type
      type: string
      description: The type of SEC filing to fetch (e.g., 10-K, 10-Q)
      required: false
      default: null
    - name: limit
      type: integer
      description: The maximum number of filings to return
      required: false
      default: null
  outputs:
    - name: filings
      type: array
      description: List of filings, each containing metadata and content

implementation:
  runtime: python3.10
  entrypoint: impl.py
  dependencies: []

testing:
  fixtures:
    - input:
        ticker: "AAPL"
        filing_type: "10-K"
        limit: 1
      expected_output_contains:
        - filings

metadata:
  tags: [synthesized]
  category: general
  generated_by: vibe_tool
