  name: text_summarizer
  version: 1.0.0
  description: Generate a concise summary of a research paper's abstract and key points.
  author: vibe_tool

interface:
  inputs:
    - name: text
      type: string
      description: The text content of the paper or abstract to summarize.
      required: true
