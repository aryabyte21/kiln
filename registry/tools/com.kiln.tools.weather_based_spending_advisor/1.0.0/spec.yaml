kiln_version: "1.0"

tool:
  id: com.kiln.tools.weather_based_spending_advisor
  name: weather_based_spending_advisor
  version: 1.0.0
  description: Recommend a reasonable spending amount for a location based on current weather conditions and local economic factors.
  author: kiln_synthesis

interface:
  inputs:
    - name: location
      type: string
      description: The city or location for which spending advice is needed.
      required: true
    - name: weather_data
      type: object
      description: Current weather conditions (e.g., temperature, humidity, weather description) for the location.
      required: true
    - name: base_currency
      type: string
      description: The local currency of the location (e.g., SGD for Singapore).
      required: true
  outputs:
    - name: spending_amount
      type: float
      description: Recommended spending amount in the local currency.
    - name: rationale
      type: string
      description: Brief explanation of how the weather influenced the spending recommendation.

implementation:
  runtime: python3.10
  entrypoint: impl.py
  dependencies: []

testing:
  fixtures:
    - input:
        location: "test"
        weather_data: {}
        base_currency: "test"
      expected_output_contains:
        - spending_amount
        - rationale

metadata:
  tags: [synthesized]
  category: general
  generated_by: kiln_synthesis
