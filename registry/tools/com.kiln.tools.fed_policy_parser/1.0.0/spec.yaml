kiln_version: "1.0"

tool:
  id: com.kiln.tools.fed_policy_parser
  name: fed_policy_parser
  version: 1.0.0
  description: Parse Fed policy statements and meeting minutes to extract structured details such as interest rate decisions, forward guidance, and economic projections.
  author: vibe_tool

interface:
  inputs:
    - name: document_url
      type: string
      description: URL of the Fed policy document or meeting minutes to parse.
      required: true
  outputs:
    - name: interest_rate_decision
      type: float
      description: The announced interest rate decision.
    - name: forward_guidance
      type: string
      description: Summary of the Fed's forward guidance on future policy.
    - name: economic_projections
      type: object
      description: Key economic projections (e.g., GDP growth, inflation, unemployment).
    - name: meeting_date
      type: string
      description: Date of the Fed meeting or policy announcement.

implementation:
  runtime: python3.10
  entrypoint: impl.py
  dependencies: []

testing:
  fixtures:
    - input:
        document_url: "test"
      expected_output_contains:
        - interest_rate_decision
        - forward_guidance
        - economic_projections
        - meeting_date

metadata:
  tags: [synthesized]
  category: general
  generated_by: vibe_tool
