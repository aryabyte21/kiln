babel_version: "1.0"
tool:
  id: com.aria.tools.maps_directions
  name: maps_directions
  version: "1.0.0"
  description: "Get driving/walking/cycling directions and distance between two locations using OpenRouteService."
  author: aria
interface:
  inputs:
    - name: origin
      type: string
      description: "Starting location (address or 'lat,lng')"
      required: true
    - name: destination
      type: string
      description: "Destination location (address or 'lat,lng')"
      required: true
    - name: mode
      type: string
      description: "Travel mode: 'driving-car', 'cycling-regular', 'foot-walking' (default: driving-car)"
      required: false
      default: "driving-car"
  outputs:
    - name: origin
      type: string
    - name: destination
      type: string
    - name: mode
      type: string
    - name: distance_km
      type: number
      description: "Total route distance in kilometres"
    - name: duration_minutes
      type: number
      description: "Estimated travel time in minutes"
    - name: steps
      type: array
      description: "Turn-by-turn instruction strings"
    - name: success
      type: boolean
implementation:
  runtime: python3.10
  entrypoint: maps_directions.py
  dependencies:
    - requests>=2.28
testing:
  fixtures:
    - input:
        origin: "Singapore"
        destination: "Changi Airport, Singapore"
      expected_output_contains: [distance_km, duration_minutes, success]
metadata:
  tags: [maps, directions, navigation, utility]
  category: maps
