babel_version: "1.0"
tool:
  id: com.aria.tools.stock_price
  name: stock_price
  version: "1.0.0"
  description: "Get the current stock price for a given ticker symbol."
  author: vibe_coder
interface:
  inputs:
    - name: ticker
      type: string
      description: "Stock ticker symbol e.g. AAPL"
      required: true
    - name: exchange
      type: string
      description: "Stock exchange e.g. NYSE, NASDAQ"
      required: false
      default: NYSE
  outputs:
    - name: price
      type: number
      description: Current stock price in USD
implementation:
  runtime: python3.10
  entrypoint: stock_price.py
testing:
  fixtures:
    - input:
        ticker: AAPL
      expected_output_contains: [price, success]
    - input:
        ticker: NVDA
        exchange: NASDAQ
      expected_output_contains: [ticker, price, currency]
