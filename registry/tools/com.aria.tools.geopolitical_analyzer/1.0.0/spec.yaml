babel_version: "1.0"

tool:
  id: com.aria.tools.geopolitical_analyzer
  name: geopolitical_analyzer
  version: 1.0.0
  description: Analyze geopolitical events and their potential impact on global markets, including commodities like gold.
  author: vibe_tool

interface:
  inputs:
    - name: events
      type: string
      description: A summary of geopolitical events to analyze.
      required: true
    - name: historical_context
      type: string
      description: Historical context or past events for comparison.
      required: false
      default: null
  outputs:
    - name: impact_summary
      type: string
      description: A summary of the potential impact on global markets.
    - name: commodity_impact
      type: object
      description: Detailed impact on specific commodities like gold, oil, etc.

implementation:
  runtime: python3.10
  entrypoint: impl.py
  dependencies: []

testing:
  fixtures:
    - input:
        events: test
        historical_context: test
      expected_output_contains:
        - impact_summary
        - commodity_impact

metadata:
  tags: [synthesized]
  category: general
  generated_by: vibe_tool
