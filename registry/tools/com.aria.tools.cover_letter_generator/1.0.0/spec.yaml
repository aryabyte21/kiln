babel_version: "1.0"

tool:
  id: com.aria.tools.cover_letter_generator
  name: cover_letter_generator
  version: 1.0.0
  description: Generate a tailored cover letter for a job posting based on the user's profile and the job details.
  author: vibe_tool

interface:
  inputs:
    - name: user_profile
      type: object
      description: User's professional profile, including skills, experience, and preferences.
      required: true
    - name: job_details
      type: object
      description: Structured details of the job posting, including title, company, description, and requirements.
      required: true
  outputs:
    - name: cover_letter
      type: string
      description: Generated cover letter text.

implementation:
  runtime: python3.10
  entrypoint: impl.py
  dependencies: []

testing:
  fixtures:
    - input:
        user_profile:
          name: "John Doe"
          skills: ["Python", "Machine Learning"]
          experience: "5 years in software development"
        job_details:
          title: "Software Engineer"
          company: "Tech Corp"
          description: "Develop and maintain software applications."
          requirements: ["Python", "Problem-solving"]
      expected_output_contains:
        - cover_letter

metadata:
  tags: [synthesized]
  category: general
  generated_by: vibe_tool
