kiln_version: "1.0"

tool:
  id: com.kiln.tools.paper_extractor
  name: paper_extractor
  version: 1.0.0
  description: Extract structured details (title, authors, abstract, publication date) from plain-text research paper content.
  author: vibe_tool

interface:
  inputs:
    - name: text_content
      type: string
      description: The plain-text content of a research paper.
      required: true
  outputs:
    - name: title
      type: string
      description: The title of the research paper.
    - name: authors
      type: string
      description: Comma-separated list of authors.
    - name: abstract
      type: string
      description: The abstract of the research paper.
    - name: publication_date
      type: string
      description: The publication date of the paper (YYYY-MM-DD).
    - name: url
      type: string
      description: The URL of the research paper.

implementation:
  runtime: python3.10
  entrypoint: impl.py
  dependencies: []

testing:
  fixtures:
    - input:
        text_content: "test"
      expected_output_contains:
        - title
        - authors
        - abstract
        - publication_date
        - url

metadata:
  tags: [synthesized]
  category: general
  generated_by: vibe_tool
