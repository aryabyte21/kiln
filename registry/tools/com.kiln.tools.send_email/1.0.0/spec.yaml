kiln_version: "1.0"
tool:
  id: com.kiln.tools.send_email
  name: send_email
  version: "1.0.0"
  description: "Send an email via SMTP (Gmail, Outlook, or any SMTP server). Credentials are read from environment variables."
  author: aria
interface:
  inputs:
    - name: to
      type: string
      description: "Recipient email address"
      required: true
    - name: subject
      type: string
      description: "Email subject line"
      required: true
    - name: body
      type: string
      description: "Plain-text email body"
      required: true
    - name: cc
      type: string
      description: "CC email address (optional)"
      required: false
      default: ""
  outputs:
    - name: to
      type: string
    - name: subject
      type: string
    - name: success
      type: boolean
    - name: message_id
      type: string
implementation:
  runtime: python3.10
  entrypoint: send_email.py
  dependencies: []
testing:
  fixtures:
    - input:
        to: "test@example.com"
        subject: "Test email from ARIA"
        body: "Hello from ARIA tool!"
      expected_output_contains: [success]
metadata:
  tags: [email, communication, utility]
  category: communication
