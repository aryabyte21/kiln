kiln_version: "1.0"

tool:
  id: com.kiln.tools.wikipedia_parser
  name: wikipedia_parser
  version: 1.0.0
  description: Parse structured information (e.g., history, rules, formats) from a Wikipedia page's plain-text content.
  author: vibe_tool

interface:
  inputs:
    - name: content
      type: string
      description: Plain-text content of the Wikipedia page.
      required: true
  outputs:
    - name: title
      type: string
      description: Title of the Wikipedia page.
    - name: introduction
      type: string
      description: Introduction or summary section of the page.
    - name: history
      type: string
      description: History section of the page.
    - name: rules
      type: string
      description: Rules and gameplay section of the page.
    - name: formats
      type: string
      description: Description of different cricket formats (e.g., Test, ODI, T20).
    - name: notable_events
      type: string
      description: Notable events or records in cricket history.

implementation:
  runtime: python3.10
  entrypoint: impl.py
  dependencies: []

testing:
  fixtures:
    - input:
        content: "test"
      expected_output_contains:
        - title
        - introduction
        - history
        - rules
        - formats
        - notable_events

metadata:
  tags: [synthesized]
  category: general
  generated_by: vibe_tool
