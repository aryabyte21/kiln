babel_version: "1.0"

tool:
  id: com.aria.tools.financial_report_parser
  name: financial_report_parser
  version: 1.0.0
  description: Parse plain-text or PDF financial reports to extract structured financial data such as revenue, net income, EPS, and guidance.
  author: vibe_tool

interface:
  inputs:
    - name: content
      type: string
      description: Plain-text or extracted text from a financial report.
      required: true
    - name: source_type
      type: string
      description: Type of source (e.g., 'pdf', 'html', 'plain_text').
      required: true
  outputs:
    - name: revenue
      type: float
      description: Total revenue for the quarter.
    - name: net_income
      type: float
      description: Net income for the quarter.
    - name: eps
      type: float
      description: Earnings per share for the quarter.
    - name: guidance
      type: string
      description: Forward guidance provided by the company.
    - name: highlights
      type: string
      description: Key highlights from the report.

implementation:
  runtime: python3.10
  entrypoint: impl.py
  dependencies: []

testing:
  fixtures:
    - input:
        content: "test"
        source_type: "test"
      expected_output_contains:
        - revenue
        - net_income
        - eps
        - guidance
        - highlights

metadata:
  tags: [synthesized]
  category: general
  generated_by: vibe_tool
