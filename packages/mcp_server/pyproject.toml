[project]
name = "kiln-mcp-server"
version = "1.0.0"
description = "Kiln MCP Server - placeholder for MCP protocol phase"
requires-python = ">=3.12"
dependencies = [
    "kiln-shared",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kiln_mcp"]

[tool.uv.sources]
kiln-shared = { workspace = true }
