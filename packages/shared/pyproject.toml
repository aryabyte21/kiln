[project]
name = "kiln-shared"
version = "1.0.0"
description = "Shared models, specs, and schema for Kiln services"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kiln_shared"]
