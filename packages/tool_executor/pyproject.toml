[project]
name = "kiln-tool-executor"
version = "1.0.0"
description = "Kiln Tool Executor - placeholder for cloud phase gVisor-sandboxed execution"
requires-python = ">=3.12"
dependencies = [
    "kiln-shared",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kiln_executor"]

[tool.uv.sources]
kiln-shared = { workspace = true }
