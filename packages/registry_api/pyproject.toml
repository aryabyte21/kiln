[project]
name = "kiln-registry-api"
version = "1.0.0"
description = "Kiln Registry API - tool CRUD, registry, loader, runtime, compiler"
requires-python = ">=3.12"
dependencies = [
    "kiln-shared",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kiln_registry"]

[tool.uv.sources]
kiln-shared = { workspace = true }
