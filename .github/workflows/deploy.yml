name: CD — Build, Push, Deploy to GKE

# Manual trigger only. Automatic runs on every merge are disabled until a
# GCP project is wired up (requires `GCP_PROJECT` variable + a Workload
# Identity provider secret). Running on push to main without these
# configured is a guaranteed failure — wasteful, noisy, and it buries real
# CI failures under a sea of red.
on:
  workflow_dispatch:

env:
  GCP_REGION: asia-southeast1

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Fail clearly if GCP deployment isn't configured
        # Validate the SAME names the real auth/push steps use below:
        # `vars.GCP_PROJECT` for the project id + `secrets.WIF_PROVIDER`
        # for the Workload Identity Federation provider. If those are out
        # of sync with what's actually referenced at deploy time this
        # check becomes useless.
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
        run: |
          missing=""
          [[ -z "$GCP_PROJECT" ]] && missing="$missing vars.GCP_PROJECT"
          [[ -z "$WIF_PROVIDER" ]] && missing="$missing secrets.WIF_PROVIDER"
          if [[ -n "$missing" ]]; then
            echo "::error::GCP deployment is not configured. Missing:$missing"
            echo "::error::Set them at Settings → Secrets and variables → Actions,"
            echo "::error::or remove .github/workflows/deploy.yml if you don't deploy to GCP."
            exit 1
          fi

  build-push:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - service: registry_api
            module: kiln_registry.main:app
            port: "8766"
            image: registry-api
          - service: chat_backend
            module: kiln_chat_backend.main:app
            port: "8765"
            image: chat-backend
          - service: tool_executor
            module: kiln_executor.main:app
            port: "8767"
            image: tool-executor
          - service: mcp_server
            module: kiln_mcp.main:app
            port: "8768"
            image: mcp-server
          - service: synthesis_service
            module: kiln_synthesis.main:app
            port: "8002"
            image: synthesis-service
    env:
      GAR_REGISTRY: asia-southeast1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/kiln
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.python.prod
          build-args: |
            SERVICE=${{ matrix.service }}
            MODULE=${{ matrix.module }}
            PORT=${{ matrix.port }}
          tags: |
            ${{ env.GAR_REGISTRY }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
            ${{ env.GAR_REGISTRY }}/${{ matrix.image }}:latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build-push]
    permissions:
      contents: read
      id-token: write
    env:
      GKE_CLUSTER: kiln-dev-gke
      GAR_REGISTRY: asia-southeast1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/kiln
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: kiln-dev-gke
          location: ${{ env.GCP_REGION }}

      - name: Install Tanka + Jsonnet Bundler
        run: |
          curl -fSL -o /usr/local/bin/tk "https://github.com/grafana/tanka/releases/latest/download/tk-linux-amd64"
          chmod +x /usr/local/bin/tk
          curl -fSL -o /usr/local/bin/jb "https://github.com/jsonnet-bundler/jsonnet-bundler/releases/latest/download/jb-linux-amd64"
          chmod +x /usr/local/bin/jb

      - name: Install Jsonnet dependencies
        working-directory: infra/tanka
        run: jb install

      - name: Deploy with Tanka
        working-directory: infra/tanka
        env:
          TK_IMAGE_REGISTRY: ${{ env.GAR_REGISTRY }}
          TK_IMAGE_TAG: ${{ env.IMAGE_TAG }}
          TK_REGISTRY_DB: ${{ secrets.REGISTRY_DB_CONNECTION }}
          TK_CHAT_DB: ${{ secrets.CHAT_DB_CONNECTION }}
          TK_GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          TK_WORKLOAD_SA: ${{ secrets.WORKLOAD_SA }}
        run: |
          tk apply environments/default \
            --ext-str IMAGE_REGISTRY="$TK_IMAGE_REGISTRY" \
            --ext-str IMAGE_TAG="$TK_IMAGE_TAG" \
            --ext-str REGISTRY_DB_CONNECTION="$TK_REGISTRY_DB" \
            --ext-str CHAT_DB_CONNECTION="$TK_CHAT_DB" \
            --ext-str GCS_BUCKET="$TK_GCS_BUCKET" \
            --ext-str WORKLOAD_SA="$TK_WORKLOAD_SA" \
            --dangerous-auto-approve
