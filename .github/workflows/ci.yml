name: CI — Lint, Test, Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  # ── Python lint + typecheck ────────────────────────────────────────────
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  # ── Python tests ───────────────────────────────────────────────────────
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen
      - run: uv run pytest -x -q

  # ── TypeScript lint + typecheck ────────────────────────────────────────
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/registry_ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: packages/registry_ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit

  # ── Docker build (verify images build) ─────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: [python-lint, python-test, frontend-check]
    strategy:
      matrix:
        include:
          - service: registry_api
            module: kiln_registry.main:app
            port: "8766"
            image: registry-api
          - service: chat_backend
            module: kiln_chat_backend.main:app
            port: "8765"
            image: chat-backend
          - service: tool_executor
            module: kiln_executor.main:app
            port: "8767"
            image: tool-executor
          - service: mcp_server
            module: kiln_mcp.main:app
            port: "8768"
            image: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.python.prod
          build-args: |
            SERVICE=${{ matrix.service }}
            MODULE=${{ matrix.module }}
            PORT=${{ matrix.port }}
          tags: kiln-${{ matrix.image }}:ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
