name: Gemini Review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Review pull request with Gemini
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const marker = '<!-- gemini-pr-review -->';
            const maxFiles = 30;
            const maxPatchChars = 4000;
            const maxTotalChars = 45000;

            if (!process.env.GEMINI_API_KEY) {
              core.setFailed('Missing required secret: GEMINI_API_KEY');
              return;
            }

            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const prNumber = pr.number;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const reviewable = files.filter((file) =>
              ['added', 'modified', 'renamed'].includes(file.status),
            );

            if (!reviewable.length) {
              core.info('No reviewable file patches found. Skipping Gemini review.');
              return;
            }

            let total = 0;
            const diffBlocks = [];

            for (const file of reviewable.slice(0, maxFiles)) {
              let patch = file.patch || '';

              if (patch.length > maxPatchChars) {
                patch = `${patch.slice(0, maxPatchChars)}\n... [patch truncated]`;
              }

              const block = [
                `File: ${file.filename}`,
                `Status: ${file.status}`,
                `Changes: +${file.additions} / -${file.deletions}`,
                patch ? `Patch:\n${patch}` : 'Patch unavailable (binary or too large).',
                '',
              ].join('\n');

              if (total + block.length > maxTotalChars) {
                diffBlocks.push('... [diff truncated due to prompt size limit]');
                break;
              }

              diffBlocks.push(block);
              total += block.length;
            }

            const prompt = [
              'You are a principal engineer doing a pull request review.',
              'Review for correctness, security, reliability, and regression risk.',
              'Ignore purely stylistic nits.',
              'Respond in GitHub-flavored Markdown with these sections:',
              '1) Findings',
              '2) Test Gaps',
              '3) Summary',
              'For each finding include severity [high|medium|low], file path, why it matters, and a concrete fix.',
              'If no meaningful issues exist, explicitly say "No blocking issues found." in Findings.',
              '',
              `PR: ${pr.title}`,
              `Author: ${pr.user?.login || 'unknown'}`,
              `Base: ${pr.base.ref}`,
              `Head: ${pr.head.ref}`,
              '',
              'Diff:',
              diffBlocks.join('\n'),
            ].join('\n');

            const geminiResponse = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${process.env.GEMINI_API_KEY}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ role: 'user', parts: [{ text: prompt }] }],
                  generationConfig: {
                    temperature: 0.2,
                    maxOutputTokens: 2048,
                  },
                }),
              },
            );

            if (!geminiResponse.ok) {
              const errText = await geminiResponse.text();
              core.setFailed(`Gemini API request failed (${geminiResponse.status}): ${errText}`);
              return;
            }

            const geminiData = await geminiResponse.json();
            const reviewText = geminiData?.candidates?.[0]?.content?.parts
              ?.map((part) => part.text || '')
              .join('\n')
              .trim();

            if (!reviewText) {
              core.setFailed('Gemini API returned an empty review payload.');
              return;
            }

            const body = `${marker}\n## Gemini Code Review\n\n${reviewText}`.slice(0, 65000);

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated Gemini review comment: ${existing.id}`);
            } else {
              const created = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
              core.info(`Created Gemini review comment: ${created.data.id}`);
            }
