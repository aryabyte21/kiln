services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: kiln_registry
      POSTGRES_USER: kiln
      POSTGRES_PASSWORD: kiln_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiln -d kiln_registry"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Registry API (Python — port 8766) ───────────────────────────────────────
  registry_api:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    command: uvicorn kiln_registry.main:app --host 0.0.0.0 --port 8766 --reload
    ports:
      - "8766:8766"
    volumes:
      - ./packages/shared:/app/packages/shared
      - ./packages/registry_api:/app/packages/registry_api
      - ./registry:/app/registry
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://kiln:kiln_dev@postgres:5432/kiln_registry
    depends_on:
      postgres:
        condition: service_healthy

  # ── Chat Backend (Python — port 8765) ───────────────────────────────────────
  chat_backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    command: uvicorn kiln_chat_backend.main:app --host 0.0.0.0 --port 8765 --reload
    ports:
      - "8765:8765"
    volumes:
      - ./packages/shared:/app/packages/shared
      - ./packages/chat_backend:/app/packages/chat_backend
      - ./packages/registry_api:/app/packages/registry_api
      - ./registry:/app/registry
    env_file: .env

  # ── MCP Server (Python — port 8768) ─────────────────────────────────────────
  mcp_server:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    command: uvicorn kiln_mcp.main:mcp.streamable_http_app --host 0.0.0.0 --port 8768 --reload --factory
    ports:
      - "8768:8768"
    volumes:
      - ./packages/shared:/app/packages/shared
      - ./packages/mcp_server:/app/packages/mcp_server
    env_file: .env
    environment:
      - KILN_REGISTRY_URL=http://registry_api:8766
    depends_on:
      - registry_api

  # ── Registry UI (Next.js — port 3000) ───────────────────────────────────────
  registry_ui:
    build:
      context: ./packages/registry_ui
      dockerfile: ../../docker/Dockerfile.nextjs
    command: npm run dev -- -H 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - ./packages/registry_ui/src:/app/src
      - ./packages/registry_ui/public:/app/public
    env_file:
      - ./packages/registry_ui/.env.local
    environment:
      - NEXT_PUBLIC_REGISTRY_URL=http://localhost:8766

  # ── Chat UI (Vite — port 5173) ─────────────────────────────────────────────
  chat_ui:
    build:
      context: ./packages/chat_ui
      dockerfile: ../../docker/Dockerfile.vite
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./packages/chat_ui/src:/app/src
    env_file:
      - ./packages/chat_ui/.env

volumes:
  pgdata:
