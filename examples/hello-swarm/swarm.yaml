apiVersion: openswarm/v1alpha1
kind: Swarm
metadata:
  name: hello-swarm
  labels:
    env: demo

spec:
  budget:
    total: '$1.00'
    perTask: '$0.05'
    alertAt: 80
    hardStop: 100

  agents:
    - name: researcher
      replicas: { min: 1, max: 3, scaleOn: queue_depth }
      model: claude-sonnet-4-6
      skills: [web-browse]
      policy: default

    - name: writer
      replicas: { min: 1, max: 2 }
      model: claude-sonnet-4-6
      policy: default
      dependsOn: [researcher]

  topology:
    - from: researcher
      to: writer
      subject: research.results

  audit:
    enabled: true
    hashChaining: true
    retentionDays: 7
