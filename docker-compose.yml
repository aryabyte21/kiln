services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: kiln_registry
      POSTGRES_USER: kiln
      POSTGRES_PASSWORD: kiln_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiln -d kiln_registry"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Synthesis Service ───────────────────────────────────────────────────────
  synthesis_service:
    build:
      context: ./packages/synthesis_service
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - KILN_SYNTHESIS_MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - KILN_SYNTHESIS_CALLBACK_URL=http://host.docker.internal:8766/synthesis/callback
      - KILN_SYNTHESIS_INTERNAL_SECRET=${KILN_INTERNAL_SECRET:-}
    volumes:
      - ./packages/synthesis_service/logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
