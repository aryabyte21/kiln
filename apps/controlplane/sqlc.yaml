version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/store/queries/"
    schema: "internal/store/migrations/"
    gen:
      go:
        package: "db"
        out: "internal/store/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        query_parameter_limit: 0
        overrides:
          - db_type: "uuid"
            go_type: "string"
          - db_type: "pg_catalog.uuid"
            go_type: "string"
          - db_type: "pg_catalog.numeric"
            go_type: "float64"
          - db_type: "numeric"
            go_type: "float64"
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "pg_catalog.int4"
            go_type: "int32"
          - db_type: "pg_catalog.int8"
            go_type: "int64"
          - db_type: "pg_catalog.float4"
            go_type: "float32"
          - db_type: "pg_catalog.timestamptz"
            go_type:
              import: "time"
              type: "Time"
