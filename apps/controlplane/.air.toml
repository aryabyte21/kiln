root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/openswarm-controller"
  cmd = "go build -o ./tmp/openswarm-controller ./cmd/openswarm-controller"
  delay = 1000
  exclude_dir = ["tmp", "vendor", "node_modules"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go", "toml", "yaml"]
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
