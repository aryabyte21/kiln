[project]
name = "cs5224-py-api"
version = "0.1.0"
description = "FastAPI starter service for CS5224 monorepo"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.115.6",
  "uvicorn>=0.34.0"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
