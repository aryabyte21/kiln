babel_version: "1.0"
id: com.aria.tools.gcal_create
name: Google Calendar Create Event
description: Create a new event on Google Calendar and return the event ID and confirmation URL

interface:
  inputs:
    - name: title
      type: string
      description: Event title / summary
      required: true

    - name: start_datetime
      type: string
      description: ISO 8601 datetime string for event start (e.g. 2025-06-07T19:30:00+08:00)
      required: true

    - name: end_datetime
      type: string
      description: ISO 8601 datetime string for event end
      required: true

    - name: description
      type: string
      description: Optional event description / notes
      required: false
      default: ""

    - name: attendees
      type: array
      description: List of attendee email addresses
      required: false

    - name: location
      type: string
      description: Physical location or meeting link
      required: false

    - name: calendar_id
      type: string
      description: Google Calendar ID (defaults to primary calendar)
      required: false
      default: primary

  output:
    type: object
    fields:
      - name: event_id
        type: string
        description: Google Calendar event ID
      - name: url
        type: string
        description: Direct link to the created event
      - name: confirmed_time
        type: string
        description: Confirmed start time as ISO string

implementation:
  language: python
  entry_point: impl.py
  function: run
  dependencies:
    - google-auth
    - google-auth-oauthlib
    - google-api-python-client

targets:
  - ag2
  - raw_python

testing:
  fixtures:
    - description: Create a dinner reservation event
      input:
        title: "Dinner at Odette"
        start_datetime: "2025-06-07T19:30:00+08:00"
        end_datetime: "2025-06-07T21:30:00+08:00"
        location: "1 Saint Andrew's Road, Singapore"
      expect_keys:
        - event_id
        - url

execution:
  timeout: 15
  retries: 1
  async: false
  error_format:
    type: object
    fields:
      - name: error
        type: string
      - name: code
        type: integer

metadata:
  author: ARIA Team — E1
  version: 1.0.0
  tags: [calendar, scheduling, google]
  api_keys_required: [GOOGLE_CALENDAR_CREDENTIALS_JSON]
