apiVersion: apps/v1
kind: Deployment
metadata:
  name: py-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: py-api
  template:
    metadata:
      labels:
        app: py-api
    spec:
      containers:
        - name: py-api
          image: ghcr.io/your-org/cs5224-py-api:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: py-api
spec:
  selector:
    app: py-api
  ports:
    - port: 80
      targetPort: 8000
