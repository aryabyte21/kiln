apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cs5224-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/cs5224-monorepo.git
    targetRevision: main
    path: infra/k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: cs5224-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
