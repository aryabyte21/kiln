apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cs5224-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/cs5224-monorepo.git
    targetRevision: main
    path: infra/k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: cs5224-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
