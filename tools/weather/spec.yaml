babel_version: "1.0"
id: com.aria.tools.weather
name: Weather Tool
description: Get current weather conditions and short-range forecast for any location using OpenWeatherMap

interface:
  inputs:
    - name: location
      type: string
      description: City name (e.g. "Singapore"), "City, Country" (e.g. "Paris, FR"), or "lat,lon"
      required: true

    - name: units
      type: enum
      description: Temperature unit system — metric (°C), imperial (°F), standard (Kelvin)
      required: false
      values: [metric, imperial, standard]
      default: metric

    - name: forecast_days
      type: integer
      description: Number of forecast days to include (0 = current only, max 5)
      required: false
      default: 0

  output:
    type: object
    fields:
      - name: temperature
        type: float
        description: Current temperature in requested units
      - name: feels_like
        type: float
      - name: conditions
        type: string
        description: Human-readable description (e.g. "light rain", "clear sky")
      - name: humidity
        type: integer
        description: Relative humidity percentage
      - name: wind_speed
        type: float
        description: Wind speed in m/s (metric) or mph (imperial)
      - name: location_name
        type: string
        description: Resolved city/location name from API
      - name: forecast
        type: array
        description: Daily forecast objects [{date, high, low, conditions}]

implementation:
  language: python
  entry_point: impl.py
  function: run
  dependencies:
    - requests

targets:
  - ag2
  - raw_python

testing:
  fixtures:
    - description: Basic city lookup — Singapore
      input:
        location: Singapore
      expect_keys:
        - temperature
        - conditions
        - location_name

    - description: Imperial units, New York
      input:
        location: "New York, US"
        units: imperial
      expect_keys:
        - temperature
        - humidity

    - description: With 3-day forecast
      input:
        location: London
        forecast_days: 3
      expect_keys:
        - forecast

execution:
  timeout: 10
  retries: 2
  async: false
  error_format:
    type: object
    fields:
      - name: error
        type: string
      - name: code
        type: integer

metadata:
  author: ARIA Team — E2
  version: 1.0.0
  tags: [weather, utility, real-time, openweathermap]
  api_keys_required: [OPENWEATHERMAP_API_KEY]
